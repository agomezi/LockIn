name: Brickable

# Regenerate the Xcode project after changing this file:
#   xcodegen generate
# (install with `brew install xcodegen`)

options:
  bundleIdPrefix: com.agomezi
  createIntermediateGroups: true
  groupSortPosition: top
  deploymentTarget:
    iOS: "17.0"

fileGroups:
  - project.yml
  - Config

# DEVELOPMENT_TEAM lives in Config/Signing.xcconfig, which is gitignored so the
# team identifier stays off GitHub. Copy Config/Signing.example.xcconfig to
# Config/Signing.xcconfig and fill in your own before building.
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1" # iPhone only
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  # ---------------------------------------------------------------- main app
  Brickable:
    type: application
    platform: iOS
    sources:
      - path: Brickable
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agomezi.brickable
        INFOPLIST_FILE: Config/Brickable-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Brickable.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: ShieldConfigurationExtension
      - target: ShieldActionExtension
      - target: DeviceActivityMonitorExtension

  # ------------------------------------------- block screen: how it looks
  ShieldConfigurationExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShieldConfigurationExtension
      - path: Brickable/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agomezi.brickable.ShieldConfiguration
        INFOPLIST_FILE: Config/ShieldConfigurationExtension-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/ShieldConfigurationExtension.entitlements

  # --------------------------------------- block screen: what buttons do
  ShieldActionExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShieldActionExtension
      - path: Brickable/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agomezi.brickable.ShieldAction
        INFOPLIST_FILE: Config/ShieldActionExtension-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/ShieldActionExtension.entitlements

  # ------------------------------------------------ auto-unlock timeout
  DeviceActivityMonitorExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: DeviceActivityMonitorExtension
      - path: Brickable/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agomezi.brickable.DeviceActivityMonitor
        INFOPLIST_FILE: Config/DeviceActivityMonitorExtension-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/DeviceActivityMonitorExtension.entitlements

  # ------------------------------------------------------------- unit tests
  BrickableTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BrickableTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agomezi.brickable.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Brickable

schemes:
  Brickable:
    build:
      targets:
        Brickable: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BrickableTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
